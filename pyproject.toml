[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openbq-eodhd"
version = "9.0.1"
description = "EODHD provider extension for OpenBB (equity/crypto/currency historical, fundamentals, corporate actions, ownership, insider trading, analyst estimates)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{name = "SecretoftheUniverse.com LLC"}]
dependencies = [
    "openbb-core>=2.0.1,<3",
    # Runtime deps of the official EODHD SDK, which is vendored under
    # openbq_eodhd/_vendor/eodhd at upstream commit f98e69d (see NOTICE):
    # PyPI rejects direct-URL dependencies, and PyPI's `eodhd` (1.0.32)
    # predates the typed errors, request timeouts and fundamentals `filter`.
    "numpy>=1.25.2",
    "pandas>=2.1.0",
    "requests>=2.31.0",
    "rich>=13.5.2",
]

# Registers the `eodhd` provider with OpenBB's plugin system.
[project.entry-points."openbb_provider_extension"]
eodhd = "openbq_eodhd:eodhd_provider"

# Mounts the obb.eodhd.* mirror router. OpenBB mounts a core extension under
# its entry-point name, so the key `eodhd` puts the router at /api/v1/eodhd.
[project.entry-points."openbb_core_extension"]
eodhd = "openbq_eodhd.eodhd_router:router"

[tool.setuptools.packages.find]
include = ["openbq_eodhd*"]

[tool.setuptools.package-data]
openbq_eodhd = ["assets/*.json", "_vendor/eodhd/LICENSE"]

[project.optional-dependencies]
dev = ["ruff==0.15.22", "pytest", "httpx2"]  # httpx2: Starlette TestClient

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", "__pycache__", "*.egg-info", "build", "dist", "tests/__pycache__", "openbq_eodhd/_vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
ignore = [
    # Import-outside-toplevel is intentional: lazy imports avoid loading
    # heavy deps at module-import time.
    "PLC0415",
]
